<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moltbot - AI Personal Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .app-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-container {
            grid-column: 1 / -1;
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
        }

        .user-message {
            background: #667eea;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .bot-message {
            background: #e8eaf6;
            color: #333;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
        }

        .chat-input button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
        }

        .chat-input button:hover {
            background: #5a6fd8;
        }

        .task-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-form input, .task-form select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .task-form button {
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .task-form button:hover {
            background: #5a6fd8;
        }

        .task-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .task-item {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-item h4 {
            margin: 0;
            color: #333;
        }

        .task-item .priority {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .priority-high {
            background: #ffebee;
            color: #c62828;
        }

        .priority-medium {
            background: #fff3e0;
            color: #ef6c00;
        }

        .priority-low {
            background: #e8f5e8;
            color: #2e7d32;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .skill-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .skill-item.enabled {
            border-color: #667eea;
            background: #e8eaf6;
        }

        .skill-item h4 {
            margin: 0 0 5px 0;
            color: #333;
        }

        .skill-item p {
            margin: 0;
            font-size: 12px;
            color: #666;
        }

        .status {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .app-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Moltbot</h1>
            <p>AI-Powered Personal Assistant Demo</p>
        </div>

        <div class="status" id="status">
            Connecting to Moltbot API...
        </div>

        <div class="app-grid">
            <!-- Chat Interface -->
            <div class="card chat-container">
                <h2>💬 Chat with Moltbot</h2>
                <div class="chat-messages" id="chatMessages">
                    <div class="message bot-message">
                        Hello! I'm Moltbot, your AI assistant. How can I help you today?
                    </div>
                </div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Type your message..." />
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>

            <!-- Task Management -->
            <div class="card">
                <h2>📝 Task Management</h2>
                <div class="task-form">
                    <input type="text" id="taskTitle" placeholder="Task title..." />
                    <select id="taskPriority">
                        <option value="low">Low Priority</option>
                        <option value="medium">Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                    <button onclick="createTask()">Add Task</button>
                </div>
                <div class="task-list" id="taskList"></div>
            </div>

            <!-- Skills Management -->
            <div class="card">
                <h2>🔧 Skills & Features</h2>
                <div class="skills-grid" id="skillsGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001';
        let currentUser = null;
        let conversationId = null;

        // Initialize the app
        async function init() {
            try {
                // Check API health
                const healthResponse = await fetch(`${API_BASE}/api/health`);
                const health = await healthResponse.json();
                
                if (health.status === 'healthy') {
                    document.getElementById('status').innerHTML = '✅ Connected to Moltbot API - Ready to use!';
                    
                    // Create a test user
                    await createUser();
                    await loadSkills();
                    await loadTasks();
                } else {
                    document.getElementById('status').innerHTML = '❌ API not healthy';
                }
            } catch (error) {
                document.getElementById('status').innerHTML = '❌ Failed to connect to API. Make sure the backend is running on port 8001.';
            }
        }

        // Create a user
        async function createUser() {
            try {
                const response = await fetch(`${API_BASE}/api/users/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'Demo User',
                        email: `demo-${Date.now()}@example.com`
                    })
                });
                const data = await response.json();
                currentUser = data.user_id;
            } catch (error) {
                console.error('Error creating user:', error);
            }
        }

        // Send chat message
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message || !currentUser) return;

            // Add user message to chat
            addMessage(message, 'user');
            input.value = '';

            try {
                const response = await fetch(`${API_BASE}/api/chat/message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser,
                        message: message,
                        conversation_id: conversationId
                    })
                });

                const data = await response.json();
                conversationId = data.conversation_id;
                addMessage(data.response, 'bot');
            } catch (error) {
                addMessage('Sorry, I encountered an error. Please try again.', 'bot');
            }
        }

        // Add message to chat
        function addMessage(text, sender) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Create task
        async function createTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const priority = document.getElementById('taskPriority').value;
            
            if (!title || !currentUser) return;

            try {
                await fetch(`${API_BASE}/api/tasks/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser,
                        title: title,
                        priority: priority
                    })
                });

                document.getElementById('taskTitle').value = '';
                await loadTasks();
            } catch (error) {
                console.error('Error creating task:', error);
            }
        }

        // Load tasks
        async function loadTasks() {
            if (!currentUser) return;

            try {
                const response = await fetch(`${API_BASE}/api/tasks/list/${currentUser}`);
                const data = await response.json();
                
                const taskList = document.getElementById('taskList');
                taskList.innerHTML = '';

                if (data.tasks && data.tasks.length > 0) {
                    data.tasks.forEach(task => {
                        const taskDiv = document.createElement('div');
                        taskDiv.className = 'task-item';
                        taskDiv.innerHTML = `
                            <h4>${task.title}</h4>
                            <span class="priority priority-${task.priority}">${task.priority.toUpperCase()}</span>
                        `;
                        taskList.appendChild(taskDiv);
                    });
                } else {
                    taskList.innerHTML = '<p style="text-align: center; color: #666;">No tasks yet. Create your first task!</p>';
                }
            } catch (error) {
                console.error('Error loading tasks:', error);
            }
        }

        // Load skills
        async function loadSkills() {
            try {
                const response = await fetch(`${API_BASE}/api/skills/list`);
                const data = await response.json();
                
                const skillsGrid = document.getElementById('skillsGrid');
                skillsGrid.innerHTML = '';

                if (data.skills) {
                    data.skills.forEach(skill => {
                        const skillDiv = document.createElement('div');
                        skillDiv.className = `skill-item ${skill.enabled ? 'enabled' : ''}`;
                        skillDiv.innerHTML = `
                            <h4>${skill.name}</h4>
                            <p>${skill.description}</p>
                        `;
                        skillsGrid.appendChild(skillDiv);
                    });
                }
            } catch (error) {
                console.error('Error loading skills:', error);
            }
        }

        // Handle Enter key in chat
        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Handle Enter key in task input
        document.getElementById('taskTitle').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                createTask();
            }
        });

        // Initialize app when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
